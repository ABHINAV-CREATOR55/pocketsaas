<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSaaS - Login & Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl shadow-slate-200/50 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-black text-2xl mx-auto shadow-md shadow-indigo-600/30">
                ₹
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Pocket<span class="text-indigo-600">SaaS</span></h1>
            <p class="text-[11px] font-extrabold uppercase tracking-widest text-indigo-600">CREATED BY ABHINAV</p>
            <p class="text-xs text-slate-400">Student Budgeting & Expense Engine</p>
        </div>

        {% if error %}
        <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-600 text-xs font-semibold text-center">
            ✅ {{ success }}
        </div>
        {% endif %}

        <!-- Tab Buttons: Sign In / Create Account / Forgot PW -->
        <div class="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold">
            <button type="button" id="tabLoginBtn" onclick="openTab('login')" class="flex-1 py-2 rounded-xl transition bg-white text-indigo-600 shadow-sm">Sign In</button>
            <button type="button" id="tabSignupBtn" onclick="openTab('signup')" class="flex-1 py-2 rounded-xl transition text-slate-500 hover:text-slate-900">Create Account</button>
            <button type="button" id="tabForgotBtn" onclick="openTab('forgot')" class="flex-1 py-2 rounded-xl transition text-slate-500 hover:text-slate-900">Forgot?</button>
        </div>

        <!-- 1. SIGN IN FORM -->
        <form id="loginForm" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Gmail Address</label>
                <input type="email" name="email" required placeholder="name@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Password</label>
                    <a href="javascript:void(0)" onclick="openTab('forgot')" class="text-[11px] font-bold text-indigo-600 hover:underline">Forgot Password?</a>
                </div>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
                Log In to Workspace →
            </button>
        </form>

        <!-- 2. CREATE ACCOUNT FORM -->
        <form id="signupForm" action="/signup" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Your Name</label>
                <input type="text" name="username" required placeholder="e.g. Abhinav" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Gmail (1 Gmail = 1 Account)</label>
                <input type="email" name="email" required placeholder="e.g. abhinav@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Create Password</label>
                <input type="password" name="password" required placeholder="Min 4 characters" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20">
                Create Account →
            </button>
        </form>

        <!-- 3. FORGOT PASSWORD FORM -->
        <form id="forgotForm" action="/forgot_password" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Your Registered Gmail</label>
                <input type="email" name="email" required placeholder="registered@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Set New Password</label>
                <input type="password" name="new_password" required placeholder="Enter new password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:border-indigo-600">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-600/20">
                Reset Password Now
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-indigo-600 hover:underline font-bold">← Back to Special Landing Page</a>
        </div>
    </div>

    <script>
        function openTab(tab) {
            ['login', 'signup', 'forgot'].forEach(t => {
                document.getElementById(t + 'Form').classList.add('hidden');
                document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').className = "flex-1 py-2 rounded-xl transition text-slate-500 hover:text-slate-900";
            });
            document.getElementById(tab + 'Form').classList.remove('hidden');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn').className = "flex-1 py-2 rounded-xl transition bg-white text-indigo-600 shadow-sm";
        }
    </script>
</body>
</html>
